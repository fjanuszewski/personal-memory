[package]
name = "guardian"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true
description = "Guardián de la memoria: prueba e instala las mejoras que hace el agente y vuelve atrás si algo falla"

[[bin]]
name = "memoria-guardian"
path = "src/main.rs"

[dependencies]
anyhow = "1"
chrono = "0.4"
regex = "1"
reqwest = { version = "0.13", default-features = false, features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "chrono", "json"] }
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[lints]
workspace = true
